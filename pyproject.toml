[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "client-pulse"
version = "0.1.0"
description = "CLI to track several client projects from YAML files: deadlines, blockers, hours and a weekly Markdown report."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mohamed-Taqy Salmi" }]
keywords = ["cli", "freelance", "project-tracking", "yaml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "ruamel.yaml>=0.18",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "build",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
client-pulse = "client_pulse.cli:app"

[project.urls]
Homepage = "https://mohamedtaqysalmi.github.io/client-pulse/"
Repository = "https://github.com/mohamedtaqysalmi/client-pulse"
Changelog = "https://github.com/mohamedtaqysalmi/client-pulse/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/client_pulse"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PT", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=client_pulse --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["client_pulse"]

[tool.coverage.report]
fail_under = 85
show_missing = true
